# HTTP template. Preserve the existing production HTTPS/Certbot configuration.
# See docs/PHASE_7A_STAFF_FRONTEND.md for the production server-block changes.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name labchain.online www.labchain.online;

    # Only Vite production output belongs in this directory.
    root /var/www/rhu-labchain;
    autoindex off;

    location = / {
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files /index.html =404;
    }

    location = /index.html {
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Do not serve hidden files, including environment and Git files.
    location ~ /\. {
        return 404;
    }

    # HashRouter needs no arbitrary-path fallback. Preserve FastAPI API/docs/404s.
    location / {
        proxy_pass http://127.0.0.1:5001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }
}
