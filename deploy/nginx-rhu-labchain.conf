server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name labchain.online www.labchain.online;

    # Only intentionally public frontend files belong under this root.
    root /opt/rhu-labchain/frontend;
    autoindex off;

    location = / {
        try_files /index.html =404;
    }

    location /static/ {
        try_files $uri =404;
    }

    # Do not serve hidden files, including environment and Git files.
    location ~ /\. {
        return 404;
    }

    # Keep API, documentation, and unknown-path behavior with FastAPI.
    location / {
        proxy_pass http://127.0.0.1:5001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }
}
